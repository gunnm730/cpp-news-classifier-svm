<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻分类系统 - News Classifier</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .card h2 { color: #333; margin-bottom: 20px; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input[type="text"], .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input[type="text"]:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .form-group textarea { min-height: 150px; resize: vertical; font-family: inherit; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; width: 100%; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .result-card { display: none; }
        .result-card.show { display: block; }
        .result-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #e0e0e0; }
        .result-item:last-child { border-bottom: none; }
        .result-label { font-weight: 600; color: #555; }
        .result-value { color: #667eea; font-weight: 600; }
        .loading { display: none; text-align: center; padding: 40px; }
        .loading.show { display: block; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 12px; border: 2px solid #e0e0e0; background: white; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: 500; }
        .mode-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        .error { background: #fee; border: 1px solid #fcc; color: #c33; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .error.show { display: block; }
        .api-info { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .api-info code { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .api-info pre { background: #f5f5f5; padding: 10px; border-radius: 4px; margin-top: 5px; overflow-x: auto; font-size: 13px; }
        .api-info ul { margin-top: 5px; padding-left: 20px; font-size: 13px; }
        .file-upload { border: 2px dashed #ccc; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .file-upload:hover { border-color: #667eea; background: #f8f9ff; }
        .file-upload input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>新闻分类系统</h1>
            <p>基于 SVM 的文本分类服务</p>
        </div>
        
        <div class="card">
            <h2>API 信息</h2>
            <div class="api-info">
                <p><strong>端点:</strong> <code>POST /api/classify</code></p>
                <p><strong>Content-Type:</strong> <code>application/json</code></p>
                <p style="margin-top: 10px;"><strong>请求格式:</strong></p>
                <pre>{
    "category": 0,
    "model_id": "svm_news",
    "format": 0,
    "data": "文本内容"
}</pre>
            </div>
        </div>
        
        <div class="card">
            <h2>文本分类</h2>
            
            <div class="mode-toggle">
                <button class="mode-btn active" id="btn-text" onclick="switchMode('text')">文本输入</button>
                <button class="mode-btn" id="btn-file" onclick="switchMode('file')">文件上传</button>
            </div>
            
            <div id="text-mode" class="mode-content active">
                <div class="form-group">
                    <label for="text-data">文本内容</label>
                    <textarea id="text-data" placeholder="请输入要分类的新闻文本..."></textarea>
                </div>
            </div>
            
            <div id="file-mode" class="mode-content">
                <div class="file-upload" onclick="document.getElementById('file-input').click()">
                    <div style="font-size: 48px; margin-bottom: 10px;">&#128193;</div>
                    <div style="color: #666;">点击选择文件</div>
                    <div style="color: #666; font-size: 12px; margin-top: 5px;">支持 .txt 文件</div>
                    <input type="file" id="file-input" accept=".txt">
                    <div id="file-name" style="margin-top: 10px; color: #667eea; font-weight: 500; display: none;"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="category">领域分类</label>
                <select id="category">
                    <option value="0">新闻 (NEWS)</option>
                    <option value="1">医学 (MEDICAL)</option>
                    <option value="2">科技 (TECH)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="format">输出格式</label>
                <select id="format">
                    <option value="0">JSON</option>
                    <option value="1">CSV</option>
                </select>
            </div>
            
            <button class="btn" onclick="classifyText()">开始分类</button>
        </div>
        
        <div class="card error" id="error-card">
            <div id="error-message"></div>
        </div>
        
        <div class="card loading" id="loading-card">
            <div class="spinner"></div>
            <div>正在处理...</div>
        </div>
        
        <div class="card result-card" id="result-card">
            <h2>分类结果</h2>
            <div id="result-content"></div>
        </div>
    </div>
    
    <script>
        var currentMode = 'text';
        var selectedFile = null;
        
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-text').classList.remove('active');
            document.getElementById('btn-file').classList.remove('active');
            if (mode === 'text') {
                document.getElementById('btn-text').classList.add('active');
                document.getElementById('text-mode').classList.add('active');
                document.getElementById('file-mode').classList.remove('active');
            } else {
                document.getElementById('btn-file').classList.add('active');
                document.getElementById('file-mode').classList.add('active');
                document.getElementById('text-mode').classList.remove('active');
            }
        }
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (file) {
                selectedFile = file;
                var fileNameEl = document.getElementById('file-name');
                fileNameEl.textContent = file.name;
                fileNameEl.style.display = 'block';
            }
        });
        
        function showError(message) {
            var errorCard = document.getElementById('error-card');
            document.getElementById('error-message').textContent = message;
            errorCard.classList.add('show');
        }
        
        function hideError() { document.getElementById('error-card').classList.remove('show'); }
        function showLoading() { document.getElementById('loading-card').classList.add('show'); document.getElementById('result-card').classList.remove('show'); hideError(); }
        function hideLoading() { document.getElementById('loading-card').classList.remove('show'); }
        
        function showResult(result, format) {
            hideLoading();
            var resultCard = document.getElementById('result-card');
            var resultContent = document.getElementById('result-content');
            if (format === 0) {
                try {
                    var json = typeof result === 'string' ? JSON.parse(result) : result;
                    resultContent.innerHTML = '<div class="result-item"><span class="result-label">分类标签</span><span class="result-value">' + (json.label || 'N/A') + '</span></div>';
                } catch (e) { resultContent.innerHTML = '<pre>' + result + '</pre>'; }
            } else { resultContent.innerHTML = '<pre>' + result + '</pre>'; }
            resultCard.classList.add('show');
        }
        
        function classifyText() {
            hideError();
            showLoading();
            var category = document.getElementById('category').value;
            var format = document.getElementById('format').value;
            var data;
            if (currentMode === 'text') {
                data = document.getElementById('text-data').value.trim();
                if (!data) { hideLoading(); showError('请输入要分类的文本内容'); return; }
            } else {
                if (!selectedFile) { hideLoading(); showError('请选择要上传的文件'); return; }
                var reader = new FileReader();
                reader.onload = function(e) {
                    sendRequest(category, format, e.target.result);
                };
                reader.readAsText(selectedFile);
                return;
            }
            sendRequest(category, format, data);
        }
        
        function sendRequest(category, format, data) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/classify', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    hideLoading();
                    if (xhr.status === 200) {
                        showResult(xhr.responseText, parseInt(document.getElementById('format').value));
                    } else {
                        showError('请求失败: ' + xhr.responseText);
                    }
                }
            };
            xhr.send(JSON.stringify({ category: parseInt(category), model_id: 'svm_news', format: parseInt(format), data: data }));
        }
    </script>
</body>
</html>
